# Local development infrastructure.
#
# Backing services (postgres, kafka, redis, mailpit, jaeger), eureka, the
# gateway and all 13 platform services. The two SPAs are commented out below;
# run them with `npm run dev` (see docs/getting-started.md).
#
#   Bring up the stack:         docker compose -f infra/docker-compose.yml up -d
#   Tear down (keep data):      docker compose -f infra/docker-compose.yml down
#   Tear down (wipe data):      docker compose -f infra/docker-compose.yml down -v
# =============================================================================

name: ecommerce-platform

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL - one instance hosting a separate database per service.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      # Superuser credentials are LOCAL-ONLY throwaway values. Service
      # credentials are created by the init script, not here.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # Deterministic collation, so ORDER BY behaves the same for everyone.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Host port is overridable so a pre-existing local Postgres (or another
      # project's stack) does not block bring-up: POSTGRES_PORT=15432 docker compose up -d
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Executed only when the data volume is empty (first start).
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # `-d postgres` matters: without it pg_isready can report ready during the
      # init phase, before the init scripts have created the service databases.
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  # ---------------------------------------------------------------------------
  # Kafka (KRaft mode, single broker) - the event backbone for Phase 2's
  # domain event topics. KRaft mode: Kafka keeps its own metadata, so the
  # platform runs no ZooKeeper at all.
  #
  # `apache/kafka:3.9.0` is the official upstream image, KRaft-only (no
  # ZooKeeper-mode entrypoint at all) - there is no separate "which mode" flag
  # to get wrong.
  #
  # NO HOST PORT. Nothing outside the compose network talks to Kafka directly
  # in this design - only product-service (producer) and inventory-service
  # (consumer), both reached over the internal `kafka:9092` listener - so there
  # is nothing here for a developer's machine to need published.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: ecommerce-kafka
    restart: unless-stopped
    environment:
      # Single-node KRaft: this broker is also the (only) controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT everywhere - this is a dev/compose network with no external
      # exposure, matching the platform's other backing services.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # CONTROLLER must be advertised too, not just PLAINTEXT: in KRaft combined
      # mode (broker+controller on one node), Kafka's own config validation
      # computes an effective advertised address for every listener declared in
      # KAFKA_LISTENERS, including the controller one - if it's left out of
      # KAFKA_ADVERTISED_LISTENERS, that computation falls back to the raw
      # 0.0.0.0 bind address from KAFKA_LISTENERS and startup fails with
      # "advertised.listeners cannot use the nonroutable meta-address 0.0.0.0".
      # Verified empirically against apache/kafka:3.9.0 - the container will not
      # start in combined mode without this, even though CONTROLLER traffic
      # itself is quorum-internal (KAFKA_CONTROLLER_QUORUM_VOTERS), not
      # client-facing.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker: a replication factor above 1 cannot be satisfied and
      # would simply fail every topic creation. See HLD S8 - this is a
      # documented durability gap, not a scale gap.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # Broker-API-versions is a lightweight, always-available way to prove the
      # broker is accepting client connections, without depending on any topic
      # existing yet.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis - the auth-service user-snapshot cache (Phase 2). A single instance,
  # matching the "prototype-grade" scope (HLD S8): it holds nothing that cannot
  # be reconstructed from auth_db, so it needs no HA to stay correct.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      # Loopback only, like every backing service a developer might want to
      # inspect directly (`redis-cli -p 6379`) but that has no business being
      # reachable from outside the host.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ===========================================================================
  # PLATFORM SERVICES - added by the phase that builds each service.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Eureka - the service registry (Phase 1B). THE discovery mechanism for this
  # platform (there is no ZooKeeper).
  #
  # No `depends_on`: the registry owns no state and talks to nothing. It is the
  # root of the startup graph, not a participant in it.
  # ---------------------------------------------------------------------------
  eureka-server:
    build:
      context: ..
      dockerfile: services/eureka-server/Dockerfile
    container_name: ecommerce-eureka
    restart: unless-stopped
    environment:
      # Dev/compose profile is the unprofiled default in application.yml. The
      # `prod` document in that same file shows what must change for a real
      # deploy (self-preservation on, relaxed sweep intervals).
      SPRING_PROFILES_ACTIVE: default
      # Phase 10 tracing -> Jaeger (OTLP/HTTP). Dev samples everything; production default is 0.1.
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
    ports:
      # BOUND TO LOOPBACK ON PURPOSE. `- "8761:8761"` would be shorthand for
      # 0.0.0.0:8761 and publish the registry to every interface on the host -
      # including the coffee-shop wifi. Unauthenticated, /eureka/apps is a
      # complete map of every service instance and port in the platform, and it
      # accepts registrations and de-registrations from anyone who can reach it.
      #
      # This publish exists only so a developer can open the dashboard at
      # http://localhost:8761/. Services reach the registry over the compose
      # network at http://eureka-server:8761/eureka/ and do not need it at all.
      #
      # PRODUCTION GAP (Phase 1 is dev-only, documented not implemented):
      # the dashboard and /eureka/** need HTTP Basic auth (or mTLS) plus TLS
      # before this runs anywhere a network boundary is not doing the work.
      - "127.0.0.1:${EUREKA_PORT:-8761}:8761"
    healthcheck:
      # Later services gate on this with `condition: service_healthy`, so it has
      # to mean "registry is accepting registrations", not "container exists".
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Boot + Eureka bootstrap is slower than a native process; without this the
      # container is marked unhealthy and restarted before it ever comes up.
      start_period: 45s

  # ---------------------------------------------------------------------------
  # auth-service (Phase 1C) - the platform's identity provider.
  #
  # Gates on BOTH postgres (Flyway migrates on startup) and eureka (it registers
  # on startup). Without the health conditions it starts, fails to connect, and
  # restart-loops for the 30s it takes the dependencies to come up.
  #
  # DELIBERATELY NOT `depends_on: redis` (Phase 2). UserSessionCache#put writes
  # the user-snapshot cache best-effort, AFTER the login/refresh transaction has
  # already succeeded, and swallows every failure (fail open - see the class
  # Javadoc). Gating this service's startup, or any login, on an optional
  # display-only cache would trade away identity-provider availability for a
  # feature nothing on the authentication path depends on - the same call
  # product-service's `depends_on` note makes for Kafka above.
  # ---------------------------------------------------------------------------
  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/auth-service-app/Dockerfile
    container_name: ecommerce-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: default
      # Phase 10 tracing -> Jaeger (OTLP/HTTP). Dev samples everything; production default is 0.1.
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_db
      SPRING_DATASOURCE_USERNAME: auth_service
      # Injected from the developer's .env (gitignored) - never inlined here.
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in infra/.env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # Keystore produced by infra/scripts/generate-keystore.sh. MOUNTED, never
      # baked into the image and never generated at startup - a key generated
      # in-process differs on every replica and after every restart, so half the
      # fleet cannot verify the other half's tokens.
      PLATFORM_JWT_KEYSTORE_PATH: /run/secrets/jwt-keystore.p12
      PLATFORM_JWT_KEYSTORE_PASSWORD: ${JWT_KEYSTORE_PASSWORD:?set JWT_KEYSTORE_PASSWORD in infra/.env}
      PLATFORM_JWT_KEYSTORE_ALIAS: ${JWT_KEYSTORE_ALIAS:-jwt-signing}
      # Google OIDC is OPTIONAL. Left blank, the OAuth2 leg is simply not
      # installed and every other endpoint works normally.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # EXACT-MATCH allow-list for where Google login may land (comma-separated).
      # 5173 = admin SPA, 3000 = storefront (product-catalog: `npm run dev` and Docker image). The default must be in the list.
      AUTH_ALLOWED_REDIRECT_URIS: ${AUTH_ALLOWED_REDIRECT_URIS:-http://localhost:5173/auth/callback,http://localhost:3000/auth/callback}
      AUTH_DEFAULT_REDIRECT_URI: ${AUTH_DEFAULT_REDIRECT_URI:-http://localhost:5173/auth/callback}
      # Registration is ON by default: the storefront (product-catalog) lets customers sign up.
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:-true}
      # MUST be true behind HTTPS (production): marks the refresh cookie Secure.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # Per-IP auth throttle (code defaults 10 login / 60 refresh per minute stay for production); dev is relaxed
      # so the multi-user e2e scripts, which all share one client IP, are not throttled.
      AUTH_RATE_LIMIT_LOGIN_CAPACITY: ${AUTH_RATE_LIMIT_LOGIN_CAPACITY:-200}
      AUTH_RATE_LIMIT_REFRESH_CAPACITY: ${AUTH_RATE_LIMIT_REFRESH_CAPACITY:-600}
      # UserSessionCache's connection (Phase 2). Resolved on the compose network,
      # not localhost - see the depends_on note above for why this is not a
      # startup gate.
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Phase 6: password-reset / email-verification links and the call to
      # notification-service (found through Eureka; NOT a startup dependency -
      # the send is async and fail-open).
      STOREFRONT_BASE_URL: ${STOREFRONT_BASE_URL:-http://localhost:3000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in infra/.env}
      # Phase 10: AES-GCM key for TOTP secrets (base64, 32 bytes) + audit.events producer (fail-open).
      AUTH_DATA_KEY: ${AUTH_DATA_KEY:?set AUTH_DATA_KEY in infra/.env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./secrets/jwt-keystore.p12:/run/secrets/jwt-keystore.p12:ro
    ports:
      # Loopback only, like the registry: this is the identity provider, and in
      # dev the container boundary is the entire access-control story.
      - "127.0.0.1:${AUTH_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Boot + Hibernate + Flyway is slower to start than the registry.
      start_period: 60s

  # ---------------------------------------------------------------------------
  # gateway - the platform's single public edge (Phase 1D).
  #
  # THE ONLY SERVICE PUBLISHED ON A NON-LOOPBACK PORT. Everything else in this
  # file binds to 127.0.0.1; this one is meant to be reachable, and it is the
  # only place where authentication, CORS and per-route circuit breaking happen
  # for external traffic.
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    container_name: ecommerce-gateway
    restart: unless-stopped
    depends_on:
      eureka-server:
        condition: service_healthy
      # DELIBERATELY NOT `auth-service: condition: service_healthy`. The edge
      # must be able to start while its identity provider is down, or every
      # auth-service rollout becomes a platform-wide outage and every
      # auth-service crash-loop takes the gateway with it. The JWKS cache is
      # lazily populated and outage-tolerant precisely so this dependency does
      # not have to exist - see GatewayProperties.Jwks. What the gateway does
      # need is the registry, to resolve `lb://` targets at all.
    environment:
      SPRING_PROFILES_ACTIVE: default
      # Phase 10 tracing -> Jaeger (OTLP/HTTP). Dev samples everything; production default is 0.1.
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # MUST MATCH auth-service's values exactly. A mismatch produces
      # "invalid_token" on every authenticated request, with nothing in either
      # service's log pointing at the cause.
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.acme-ecommerce.internal}
      AUTH_JWT_AUDIENCES: ${AUTH_JWT_AUDIENCES:-ecommerce-platform}
      # Frontend SPAs - EXACT origins (dev and prod). `*` is forbidden alongside
      # allow-credentials, which the refresh cookie needs.
      # DEV MODE (local Vite servers):
      # - http://localhost:5173 is the Vue admin SPA dev server
      # - http://localhost:5174 is the React product catalog dev server
      # DOCKER MODE (production-like):
      # - http://localhost:3000 is the React product catalog
      # - http://localhost:3001 is the Vue admin SPA
      GATEWAY_CORS_ALLOWED_ORIGINS: ${GATEWAY_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:3000,http://localhost:3001}
      # Edge rate limit (Redis). Generous DEV defaults so the e2e scripts are not throttled; application.yml keeps 30/300 per minute.
      REDIS_HOST: redis
      GATEWAY_RATE_LIMIT_WRITES: ${GATEWAY_RATE_LIMIT_WRITES:-600}
      GATEWAY_RATE_LIMIT_READS: ${GATEWAY_RATE_LIMIT_READS:-3000}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

  # ===========================================================================
  # FRONTEND SERVICES - Customer and admin-facing SPAs
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # admin-product-catalog - the Vue 3 admin SPA for product management (Phase 1F).
  #
  # A Vite-built Vue 3 SPA serving product management endpoints. The build
  # happens in the first Docker build stage; the second stage serves the static
  # dist/ files via http-server with CORS and SPA fallback (index.html for 404s).
  #
  # Does not depend on any backend service (static files only). The Vue app
  # makes HTTP calls to /api/products and /api/inventory via the gateway,
  # which are resolved dynamically at runtime.
  #
  # Port 3001 is published to the host (unlike backend services, which are
  # loopback-only) because this is an admin-facing SPA that developers and
  # product managers access directly via the browser.
  # ---------------------------------------------------------------------------
  # admin-product-catalog:
  #   build:
  #     context: ..
  #     dockerfile: apps/admin-product-catalog/Dockerfile
  #   container_name: ecommerce-admin-catalog
  #   restart: unless-stopped
  #   environment:
  #     # Vue app runs fully on the client; no backend env vars needed.
  #     # Vite build is hardcoded to proxy /api/* to http://localhost:8080 in dev;
  #     # in Docker, the app runs as static files and the browser makes requests
  #     # directly to the gateway.
  #     NODE_ENV: production
  #   ports:
  #     # Published to 0.0.0.0:3001 so admins can access it at http://localhost:3001
  #     - "${ADMIN_CATALOG_PORT:-3001}:3001"
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3001/ || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 10s

  # ---------------------------------------------------------------------------
  # product-catalog - the React customer-facing product catalog SPA (Phase 1G).
  #
  # A Vite-built React 19 SPA serving the /api/products endpoints. The build
  # happens in the first Docker build stage; the second stage serves the static
  # dist/ files via http-server with CORS and SPA fallback (index.html for 404s).
  #
  # Does not depend on any backend service (static files only). The React app
  # makes HTTP calls to /api/products via the gateway, which are resolved
  # dynamically at runtime - no backend connectivity needed for the frontend
  # to start.
  #
  # Port 3000 is published to the host (unlike backend services, which are
  # loopback-only) because this is a public-facing SPA that developers and
  # users access directly via the browser.
  # ---------------------------------------------------------------------------
  # product-catalog:
  #   build:
  #     context: ..
  #     dockerfile: apps/product-catalog/Dockerfile
  #   container_name: ecommerce-product-catalog
  #   restart: unless-stopped
  #   environment:
  #     # React app runs fully on the client; no backend env vars needed.
  #     # Vite build is hardcoded to proxy /api/* to http://localhost:8080 in dev;
  #     # in Docker, the app runs as static files and the browser makes requests
  #     # directly to the gateway (resolved by Docker network and host port mapping).
  #     NODE_ENV: production
  #   ports:
  #     # Unlike backend services, this SPA is published to 0.0.0.0:3000 so
  #     # developers can access it at http://localhost:3000 and users can reach
  #     # the product catalog from outside the host.
  #     - "${PRODUCT_CATALOG_PORT:-3000}:3000"
  #   healthcheck:
  #     test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/ || exit 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 10s

  # ---------------------------------------------------------------------------
  # product-service (Phase 1E) - the catalog service.
  #
  # Gates on BOTH postgres (Flyway migrates on startup) and eureka (it registers
  # on startup, and the gateway's `lb://PRODUCT-SERVICE` route cannot resolve
  # until it has).
  #
  # DELIBERATELY NOT `depends_on: auth-service`. This service validates tokens
  # against auth-service's JWKS, but lazily - the first token to arrive triggers
  # the first fetch. Gating startup on the identity provider would make every
  # auth-service rollout a catalog outage, which is the same call the gateway
  # made in Phase 1D.
  #
  # DELIBERATELY NOT `depends_on: kafka` EITHER (Phase 2b). ProductEventPublisher
  # publishes strictly after each write's transaction commits, on a best-effort
  # basis - a send failure is logged, not thrown (HLD S7, S10). Gating product
  # writes/reads on a broker whose only consumer is a display-only, advisory
  # inventory count would trade away the catalog's availability for a stream
  # that is allowed to lag or be briefly unconsumed by design.
  # ---------------------------------------------------------------------------
  product-service:
    build:
      context: ..
      dockerfile: services/product-service/product-service-app/Dockerfile
    container_name: ecommerce-product
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: default
      # Phase 10 tracing -> Jaeger (OTLP/HTTP). Dev samples everything; production default is 0.1.
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/product_db
      SPRING_DATASOURCE_USERNAME: product_service
      # Injected from the developer's .env (gitignored) - never inlined here.
      SPRING_DATASOURCE_PASSWORD: ${PRODUCT_DB_PASSWORD:?set PRODUCT_DB_PASSWORD in infra/.env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # MUST MATCH auth-service's and the gateway's values EXACTLY. A mismatch
      # produces "invalid_token" on every request to /api/products/**, with
      # nothing in any service's log pointing at the cause.
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.acme-ecommerce.internal}
      AUTH_JWT_AUDIENCES: ${AUTH_JWT_AUDIENCES:-ecommerce-platform}
      # ProductEventPublisher's producer. Resolved on the compose network, not
      # localhost - see the depends_on note above for why this is not a startup
      # gate: a Kafka outage delays events, it must never delay or block a
      # product write/read.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Phase 7: X-Internal-Token for inventory-service /internal/inventory/variants.
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in infra/.env}
    ports:
      # Loopback only, like every service except the gateway: nothing outside the
      # host has any business reaching the catalog directly.
      - "127.0.0.1:${PRODUCT_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Boot + Hibernate + Flyway is slower to start than the registry.
      start_period: 60s

  # ---------------------------------------------------------------------------
  # inventory-service (Phase 2, Kafka consumer wired in Phase 3) - owns stock
  # levels in its own database and consumes product.events to keep them in
  # sync with the catalog.
  #
  # `depends_on: kafka` HERE USES `service_started`, NOT `service_healthy` -
  # deliberately asymmetric with product-service's choice to add no Kafka
  # dependency at all. Per HLD S7, neither service may let a Kafka/each-other
  # outage block its own core job: product-service's core job is catalog
  # writes, which do not need Kafka to succeed (the publish is after-commit,
  # best-effort), so it depends on nothing Kafka-related. inventory-service's
  # core job in THIS feature is consuming product.events, but "depends on" here
  # still cannot mean "must be healthy before I start" - Spring Kafka's
  # listener container retries connecting in the background on its own, so a
  # `condition: service_healthy` gate would only slow down local `docker
  # compose up` (waiting on Kafka's ~30s start_period/healthcheck) for a
  # dependency this service already tolerates being down. `service_started`
  # exists ONLY to sequence container *creation* so Kafka's container exists
  # before the first connection attempt in docker-compose's normal up-order - a
  # developer convenience, not a correctness requirement; removing this line
  # would not make anything here incorrect, only occasionally noisier in early
  # consumer-log lines on a cold `docker compose up`.
  #
  # Otherwise gates on postgres (Flyway migrates on startup) and eureka (it
  # registers on startup, and the gateway's `lb://INVENTORY-SERVICE` route
  # cannot resolve until it has), mirroring product-service's shape exactly.
  # ---------------------------------------------------------------------------
  inventory-service:
    build:
      context: ..
      dockerfile: services/inventory-service/inventory-service-app/Dockerfile
    container_name: ecommerce-inventory
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      # `service_started`, NOT `service_healthy` - see the block comment above.
      # This waits only for the Kafka container process to start, not for its
      # broker-readiness healthcheck, which is the "ordering, not a hard gate"
      # distinction this service needs.
      kafka:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: default
      # Phase 10 tracing -> Jaeger (OTLP/HTTP). Dev samples everything; production default is 0.1.
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: inventory_service
      # Injected from the developer's .env (gitignored) - never inlined here.
      SPRING_DATASOURCE_PASSWORD: ${INVENTORY_DB_PASSWORD:?set INVENTORY_DB_PASSWORD in infra/.env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in infra/.env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      # MUST MATCH auth-service's and the gateway's values EXACTLY. A mismatch
      # produces "invalid_token" on every request to /api/inventory/**, with
      # nothing in any service's log pointing at the cause.
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.acme-ecommerce.internal}
      AUTH_JWT_AUDIENCES: ${AUTH_JWT_AUDIENCES:-ecommerce-platform}
      # ProductEventListener's consumer. Resolved on the compose network, not
      # localhost - see the depends_on note above for why this is ordering-only,
      # not a startup gate: a Kafka outage delays catch-up, it must never delay
      # or block this service's own CRUD reads/writes.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      # Loopback only, like every service except the gateway: nothing outside
      # the host has any business reaching inventory directly.
      - "127.0.0.1:${INVENTORY_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      # Boot + Hibernate + Flyway is slower to start than the registry.
      start_period: 60s

  # ---------------------------------------------------------------------------
  # user-service - own database (user_db), own least-privileged role (user_service), JWT-validated like
  # product/inventory-service. DB + role come from postgres/init/01-schemas.sql on
  # a fresh volume, or scripts/create-customer-dbs.sql on an existing one.
  # Not gated on auth-service (JWKS is fetched lazily) nor on Kafka (unused).
  # ---------------------------------------------------------------------------
  user-service:
    build:
      context: ..
      dockerfile: services/user-service/user-service-app/Dockerfile
    container_name: ecommerce-user
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: default
      # Phase 10 tracing -> Jaeger (OTLP/HTTP). Dev samples everything; production default is 0.1.
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/user_db
      SPRING_DATASOURCE_USERNAME: user_service
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD:?set USER_DB_PASSWORD in infra/.env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.acme-ecommerce.internal}
      AUTH_JWT_AUDIENCES: ${AUTH_JWT_AUDIENCES:-ecommerce-platform}
      # Phase 8: /internal/** guard, membership payments, referral links
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in infra/.env}
      STOREFRONT_BASE_URL: ${STOREFRONT_BASE_URL:-http://localhost:3000}
      # Phase 10 privacy: user.events USER_DELETED producer
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:${USER_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ---------------------------------------------------------------------------
  # cart-service - own database (cart_db), own least-privileged role (cart_service), JWT-validated like
  # product/inventory-service. DB + role come from postgres/init/01-schemas.sql on
  # a fresh volume, or scripts/create-customer-dbs.sql on an existing one.
  # Not gated on auth-service (JWKS is fetched lazily) nor on Kafka (unused).
  # ---------------------------------------------------------------------------
  cart-service:
    build:
      context: ..
      dockerfile: services/cart-service/cart-service-app/Dockerfile
    container_name: ecommerce-cart
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: default
      # Phase 10 tracing -> Jaeger (OTLP/HTTP). Dev samples everything; production default is 0.1.
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cart_db
      SPRING_DATASOURCE_USERNAME: cart_service
      SPRING_DATASOURCE_PASSWORD: ${CART_DB_PASSWORD:?set CART_DB_PASSWORD in infra/.env}
      # Phase 7: alerts consume product.events/inventory.events and email via notification-service
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in infra/.env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.acme-ecommerce.internal}
      AUTH_JWT_AUDIENCES: ${AUTH_JWT_AUDIENCES:-ecommerce-platform}
      STOREFRONT_BASE_URL: ${STOREFRONT_BASE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${CART_PORT:-8086}:8086"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ---------------------------------------------------------------------------
  # order-service - own database (order_db), own least-privileged role (order_service), JWT-validated like
  # product/inventory-service. DB + role come from postgres/init/01-schemas.sql on
  # a fresh volume, or scripts/create-customer-dbs.sql on an existing one.
  # Not gated on auth-service (JWKS is fetched lazily) nor on Kafka (unused).
  # ---------------------------------------------------------------------------
  order-service:
    build:
      context: ..
      dockerfile: services/order-service/order-service-app/Dockerfile
    container_name: ecommerce-order
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: default
      # Phase 10 tracing -> Jaeger (OTLP/HTTP). Dev samples everything; production default is 0.1.
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/order_db
      SPRING_DATASOURCE_USERNAME: order_service
      SPRING_DATASOURCE_PASSWORD: ${ORDER_DB_PASSWORD:?set ORDER_DB_PASSWORD in infra/.env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.acme-ecommerce.internal}
      AUTH_JWT_AUDIENCES: ${AUTH_JWT_AUDIENCES:-ecommerce-platform}
      # Phase 6: shared secret for /internal/** (inbound payment-result, outbound payment/
      # promotion/inventory calls) and the order.events producer (best-effort, not a startup gate).
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in infra/.env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Phase 10 risk thresholds. Production defaults (3 orders/10 min, 3 prior orders, 3x average) are
      # the code defaults; dev relaxes them so burst e2e scripts do not trip fraud holds.
      # The Phase 10 trust e2e places 8 quick orders to trip the velocity rule.
      ORDER_RISK_VELOCITY_THRESHOLD: ${ORDER_RISK_VELOCITY_THRESHOLD:-8}
      ORDER_RISK_AVG_MIN_ORDERS: ${ORDER_RISK_AVG_MIN_ORDERS:-3}
      ORDER_RISK_AVG_MULTIPLIER: ${ORDER_RISK_AVG_MULTIPLIER:-10}
    ports:
      - "127.0.0.1:${ORDER_PORT:-8087}:8087"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8087/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ---------------------------------------------------------------------------
  # rating-service - own database (rating_db), own least-privileged role (rating_service),
  # JWT-validated like the other services. Verifies purchases via order-service and display
  # names via user-service (token relayed). Publishes rating.events to Kafka best-effort
  # after commit: NOT gated on kafka (a broker outage must not block reviews).
  # ---------------------------------------------------------------------------
  rating-service:
    build:
      context: ..
      dockerfile: services/rating-service/rating-service-app/Dockerfile
    container_name: ecommerce-rating
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: default
      # Phase 10 tracing -> Jaeger (OTLP/HTTP). Dev samples everything; production default is 0.1.
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rating_db
      SPRING_DATASOURCE_USERNAME: rating_service
      SPRING_DATASOURCE_PASSWORD: ${RATING_DB_PASSWORD:?set RATING_DB_PASSWORD in infra/.env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.acme-ecommerce.internal}
      AUTH_JWT_AUDIENCES: ${AUTH_JWT_AUDIENCES:-ecommerce-platform}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RATING_MEDIA_DIR: /data/media
      # Phase 10 privacy: /internal/privacy/** guard
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in infra/.env}
    # Review photos. Root so the freshly created named volume is writable (see tech debt).
    user: "0:0"
    volumes:
      - rating-media:/data/media
    ports:
      - "127.0.0.1:${RATING_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ---------------------------------------------------------------------------
  # mailpit - dev SMTP sink + web UI/API (Phase 6). Every email (and dev "SMS",
  # mailed to sms+<digits>@acme.local) lands here instead of leaving the host.
  # UI/API on loopback only: http://127.0.0.1:8025 ; SMTP :1025 is compose-internal.
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: ecommerce-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # ---------------------------------------------------------------------------
  # notification-service (Phase 6) - stateless. Consumes order.events from Kafka
  # and exposes token-guarded /internal/notifications/{email,sms} (never routed
  # by the gateway). Sends through Mailpit in dev. NOT gated on kafka health: a
  # broker outage only delays order emails.
  # ---------------------------------------------------------------------------
  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/notification-service-app/Dockerfile
    container_name: ecommerce-notification
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: default
      # Phase 10 tracing -> Jaeger (OTLP/HTTP). Dev samples everything; production default is 0.1.
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      # Phase 8: own database (inbox, push subscriptions, campaigns) + JWT validation for /api/**
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/notification_db
      SPRING_DATASOURCE_USERNAME: notification_service
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in infra/.env}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.acme-ecommerce.internal}
      AUTH_JWT_AUDIENCES: ${AUTH_JWT_AUDIENCES:-ecommerce-platform}
      # Blank => keys are generated at first start and persisted in notification_db.settings
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@acme.local}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Defaults send to the Mailpit container. For a real provider set MAIL_* in infra/.env
      # (see docs/operations/setup-integrations.md).
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      NOTIFICATION_SENDER: ${NOTIFICATION_SENDER:-no-reply@acme.local}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS:-false}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL:-false}
      STOREFRONT_BASE_URL: ${STOREFRONT_BASE_URL:-http://localhost:3000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in infra/.env}
    ports:
      - "127.0.0.1:${NOTIFICATION_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ---------------------------------------------------------------------------
  # payment-service - Phase 6. Own database (payment_db) + role. STRIPE_SECRET_KEY blank =>
  # SIMULATED mode. Calls order-service /internal/** with X-Internal-Token.
  # ---------------------------------------------------------------------------
  payment-service:
    build:
      context: ..
      dockerfile: services/payment-service/payment-service-app/Dockerfile
    container_name: ecommerce-payment
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: default
      # Phase 10 tracing -> Jaeger (OTLP/HTTP). Dev samples everything; production default is 0.1.
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payment_db
      SPRING_DATASOURCE_USERNAME: payment_service
      SPRING_DATASOURCE_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD in infra/.env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.acme-ecommerce.internal}
      AUTH_JWT_AUDIENCES: ${AUTH_JWT_AUDIENCES:-ecommerce-platform}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in infra/.env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:${PAYMENT_PORT:-8088}:8088"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8088/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ---------------------------------------------------------------------------
  # promotion-service - Phase 6. Own database (promotion_db) + role. Coupons + redemptions.
  # ---------------------------------------------------------------------------
  promotion-service:
    build:
      context: ..
      dockerfile: services/promotion-service/promotion-service-app/Dockerfile
    container_name: ecommerce-promotion
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: default
      # Phase 10 tracing -> Jaeger (OTLP/HTTP). Dev samples everything; production default is 0.1.
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/promotion_db
      SPRING_DATASOURCE_USERNAME: promotion_service
      SPRING_DATASOURCE_PASSWORD: ${PROMOTION_DB_PASSWORD:?set PROMOTION_DB_PASSWORD in infra/.env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.acme-ecommerce.internal}
      AUTH_JWT_AUDIENCES: ${AUTH_JWT_AUDIENCES:-ecommerce-platform}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in infra/.env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:${PROMOTION_PORT:-8089}:8089"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8089/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ---------------------------------------------------------------------------
  # seller-service - Phase 9. Own database (seller_db) + role: seller onboarding/KYC,
  # feedback, settlements ledger/payouts (consumes order.events), analytics, sponsored-ad campaigns.
  # SELLER_DATA_KEY (base64, 32 bytes) encrypts bank account numbers at rest (AES-GCM).
  # ---------------------------------------------------------------------------
  seller-service:
    build:
      context: ..
      dockerfile: services/seller-service/seller-service-app/Dockerfile
    container_name: ecommerce-seller
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: default
      # Phase 10 tracing -> Jaeger (OTLP/HTTP). Dev samples everything; production default is 0.1.
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/seller_db
      SPRING_DATASOURCE_USERNAME: seller_service
      SPRING_DATASOURCE_PASSWORD: ${SELLER_DB_PASSWORD:?set SELLER_DB_PASSWORD in infra/.env}
      SELLER_DATA_KEY: ${SELLER_DATA_KEY:?set SELLER_DATA_KEY in infra/.env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.acme-ecommerce.internal}
      AUTH_JWT_AUDIENCES: ${AUTH_JWT_AUDIENCES:-ecommerce-platform}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in infra/.env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STOREFRONT_BASE_URL: ${STOREFRONT_BASE_URL:-http://localhost:3000}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL:-http://localhost:3001}
    ports:
      - "127.0.0.1:${SELLER_PORT:-8091}:8091"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8091/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ---------------------------------------------------------------------------
  # support-service - Phase 10. Own database (support_db) + role: help centre FAQ, tickets,
  # rule-based chatbot, audit log (consumes audit.events). Sends email via notification-service.
  # ---------------------------------------------------------------------------
  support-service:
    build:
      context: ..
      dockerfile: services/support-service/support-service-app/Dockerfile
    container_name: ecommerce-support
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: default
      # Phase 10 tracing -> Jaeger (OTLP/HTTP). Dev samples everything; production default is 0.1.
      OTEL_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/support_db
      SPRING_DATASOURCE_USERNAME: support_service
      SPRING_DATASOURCE_PASSWORD: ${SUPPORT_DB_PASSWORD:?set SUPPORT_DB_PASSWORD in infra/.env}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-https://auth.acme-ecommerce.internal}
      AUTH_JWT_AUDIENCES: ${AUTH_JWT_AUDIENCES:-ecommerce-platform}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?set INTERNAL_API_TOKEN in infra/.env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STOREFRONT_BASE_URL: ${STOREFRONT_BASE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${SUPPORT_PORT:-8092}:8092"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8092/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Jaeger all-in-one (Phase 10) - trace storage (in-memory) + UI. OTLP/HTTP :4318 is internal only.
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: ecommerce-jaeger
    restart: unless-stopped
    mem_limit: 256m
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      MEMORY_MAX_TRACES: "5000"
      GOMEMLIMIT: 200MiB
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  rating-media:
  postgres-data:
  kafka-data:
