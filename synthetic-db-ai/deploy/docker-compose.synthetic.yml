volumes:
  # The data volume sdai-pg already used (created anonymously by `docker run`); reused as-is so no data moves.
  sdai-pg-data:
    external: true
    name: c11c3dc4224268af387e69eb4e90286bbf25034bbaa429c217ddbaac3c1b3750

networks:
  sdai-net:
    external: true
