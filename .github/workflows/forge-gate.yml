# =============================================================================
# OpenForge gate. Runs on every pull request and always reports one status
# ("OpenForge gate"), so it can be a required check in branch protection.
#
# - Every PR: the OpenForge hook regression tests (governance must keep working).
# - PRs from forge/<id>-<slug> branches: the PR gate for that work id. It fails
#   unless the committed work record shows independent approving reviews for the
#   reviewed code, evidence for every acceptance criterion, and a diff within the
#   complexity class limit. The human approval on GitHub is still required on top.
# =============================================================================
name: OpenForge gate

on:
  pull_request:
    branches: [dev, staging, master, main, version_v1]

permissions:
  contents: read

concurrency:
  group: forge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge-gate:
    name: OpenForge gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Hook regression tests
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name ci
          node --test .openforge/tests/

      - name: PR gate (forge branches)
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CLAUDE_PROJECT_DIR: ${{ github.workspace }}
        run: |
          if [[ "$HEAD_REF" =~ ^forge/(F-[0-9]{8}-[0-9]{2})- ]]; then
            id="${BASH_REMATCH[1]}"
            git checkout -q -B "$HEAD_REF"
            node .claude/hooks/forge-gate.mjs "$id" --dir "$GITHUB_WORKSPACE"
          else
            echo "Not a forge/ branch: only the hook tests apply."
          fi
