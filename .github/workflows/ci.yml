# =============================================================================
# CI - build, test and lint every part of the monorepo.
#
# One workflow, change-detection first, so a frontend-only PR does not pay for
# the full Gradle build and a single `ci-gate` check can be made "required" in
# branch protection (path-filtered workflows that get skipped never report a
# status, which would block merges forever).
#
# Repository variable CI_ENFORCE:
#   unset / != 'true'  -> lint, audit and IaC checks REPORT but do not fail.
#   'true'             -> they fail the build.
# Backend build/test and frontend build always fail on error. Frontend
# type-check/test are report-only until the variable is 'true' (pre-existing failures).
# =============================================================================
name: CI

on:
  push:
    branches: [main, master, version_v1]
  pull_request:
    branches: [main, master, version_v1]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Non-blocking until the baseline is clean; see header.
  SOFT_FAIL: ${{ vars.CI_ENFORCE != 'true' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      admin: ${{ steps.filter.outputs.admin }}
      catalog: ${{ steps.filter.outputs.catalog }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'services/**'
              - 'libs/**'
              - 'config/**'
              - 'gradle/**'
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - '.github/workflows/ci.yml'
            admin:
              - 'apps/admin-product-catalog/**'
              - '.github/workflows/ci.yml'
            catalog:
              - 'apps/product-catalog/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'deploy/**'
              - 'infra/**'
              - '**/Dockerfile'
              - '.github/workflows/ci.yml'
            workflows:
              - '.github/**'

  backend:
    name: Backend (Gradle build, Spotless, Checkstyle, tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Only the default branch writes the cache; PRs read it.
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
      # `build` = compile + spotlessCheck + checkstyle + tests for every module.
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
      - name: Upload test and style reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          retention-days: 7
          path: |
            **/build/reports/tests/**
            **/build/reports/checkstyle/**
            **/build/test-results/**

  frontend:
    name: Frontend (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.admin == 'true' || needs.changes.outputs.catalog == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [admin-product-catalog, product-catalog]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Skip when this app did not change
        id: skip
        shell: bash
        run: |
          if [[ "${{ matrix.app }}" == "admin-product-catalog" && "${{ needs.changes.outputs.admin }}" != "true" ]] ||
             [[ "${{ matrix.app }}" == "product-catalog" && "${{ needs.changes.outputs.catalog }}" != "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - uses: actions/checkout@v4
        if: steps.skip.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.skip.outputs.skip != 'true'
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install
        if: steps.skip.outputs.skip != 'true'
        run: npm ci
      # Type check and tests are report-only until CI_ENFORCE=true: both apps have
      # failures that predate this pipeline (see docs/operations/ci-cd.md, "Baseline").
      - name: Type check
        if: steps.skip.outputs.skip != 'true'
        continue-on-error: ${{ env.SOFT_FAIL == 'true' }}
        run: npm run type-check
      - name: Lint
        if: steps.skip.outputs.skip != 'true'
        continue-on-error: ${{ env.SOFT_FAIL == 'true' }}
        run: npm run lint
      - name: Test
        if: steps.skip.outputs.skip != 'true'
        continue-on-error: ${{ env.SOFT_FAIL == 'true' }}
        run: npx vitest run
      - name: Build
        if: steps.skip.outputs.skip != 'true'
        run: npm run build
      - name: Dependency audit (production deps, high+)
        if: steps.skip.outputs.skip != 'true'
        continue-on-error: ${{ env.SOFT_FAIL == 'true' }}
        run: npm audit --omit=dev --audit-level=high

  infra:
    name: Infra (Dockerfiles, Terraform, Helm, workflows)
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Hadolint (all Dockerfiles)
        continue-on-error: ${{ env.SOFT_FAIL == 'true' }}
        run: |
          curl -fsSL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x hadolint
          rc=0
          while IFS= read -r f; do
            echo "::group::$f"
            ./hadolint --failure-threshold error "$f" || rc=1
            echo "::endgroup::"
          done < <(git ls-files '*Dockerfile')
          exit $rc

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Terraform fmt
        continue-on-error: ${{ env.SOFT_FAIL == 'true' }}
        run: terraform fmt -check -recursive -diff deploy/aws/terraform
      - name: Terraform validate (prod env)
        continue-on-error: ${{ env.SOFT_FAIL == 'true' }}
        working-directory: deploy/aws/terraform/envs/prod
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - uses: azure/setup-helm@v4
      - name: Helm lint
        continue-on-error: ${{ env.SOFT_FAIL == 'true' }}
        run: helm lint deploy/aws/helm/ecommerce

      - name: actionlint (workflow syntax and shell)
        continue-on-error: ${{ env.SOFT_FAIL == 'true' }}
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.4/scripts/download-actionlint.bash) 1.7.4
          ./actionlint -color

  # Single required status check for branch protection. Jobs that were skipped
  # by change detection count as success; failed or cancelled ones do not.
  ci-gate:
    name: ci-gate
    if: always()
    needs: [changes, backend, frontend, infra]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" == "failure" || "$r" == "cancelled" ]]; then
              echo "::error::A required CI job did not succeed ($r)"
              exit 1
            fi
          done

  # Feeds GitHub's dependency graph so Dependabot alerts cover Gradle deps.
  dependency-submission:
    name: Submit Gradle dependency graph
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/dependency-submission@v4
