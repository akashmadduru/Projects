# =============================================================================
# Security - SAST, secret scanning, dependency and IaC vulnerability scanning.
#
# Every tool here is free. No path filters: security checks run on every PR and
# on a weekly schedule (new CVEs appear without any code change).
#
# Repository variable CI_ENFORCE ('true' = findings fail the job; anything else
# = report-only). Start report-only, triage the baseline, then flip to 'true'.
#
# NOTE: uploading SARIF to the Security tab requires a public repository or
# GitHub Advanced Security. On a private repo without it the upload steps fail
# softly and the reports remain downloadable as workflow artifacts.
# =============================================================================
name: Security

on:
  push:
    branches: [main, master, version_v1]
  pull_request:
    branches: [main, master, version_v1]
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  SOFT_FAIL: ${{ vars.CI_ENFORCE != 'true' }}
  TRIVY_EXIT_CODE: ${{ vars.CI_ENFORCE == 'true' && '1' || '0' }}

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Fork PRs get a read-only token and cannot upload results.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.language == 'java-kotlin'
        with:
          cache-read-only: true
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Compile (CodeQL traces this)
        if: matrix.language == 'java-kotlin'
        run: ./gradlew compileJava --no-daemon --no-build-cache --no-configuration-cache
      - uses: github/codeql-action/analyze@v3
        continue-on-error: ${{ env.SOFT_FAIL == 'true' }}
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: Semgrep (OSS rules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: pip install --quiet semgrep==1.97.0
      - name: Scan
        continue-on-error: ${{ env.SOFT_FAIL == 'true' }}
        run: |
          semgrep scan --metrics=off --error --severity ERROR \
            --config p/default --config p/owasp-top-ten --config p/java --config p/typescript \
            --exclude node_modules --exclude build --exclude dist \
            --sarif --output semgrep.sarif .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore
          retention-days: 14
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  secrets:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just the tip
      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
      - name: Scan
        continue-on-error: ${{ env.SOFT_FAIL == 'true' }}
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

  trivy-fs:
    name: Trivy (dependencies and secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,build,dist
          exit-code: ${{ env.TRIVY_EXIT_CODE }}

  trivy-iac:
    name: Trivy (IaC / Dockerfile misconfig)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          skip-dirs: node_modules,build,dist
          exit-code: ${{ env.TRIVY_EXIT_CODE }}

  dependency-review:
    name: Dependency review (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # Needs the dependency graph: free on public repos, GHAS on private ones.
      - uses: actions/dependency-review-action@v4
        continue-on-error: ${{ env.SOFT_FAIL == 'true' }}
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
