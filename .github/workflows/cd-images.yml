# =============================================================================
# CD (images) - build, scan and publish container images to GHCR.
#
# This publishes artefacts only. It does NOT deploy: production rollout stays
# the manual, reviewed `deploy/aws/deploy.sh` flow (ECR + Terraform + Helm).
#
# Backend images use the shared deploy/aws/docker/Dockerfile. Its `build` stage
# does not depend on SERVICE, so the `backend-build` job compiles every jar once
# into the Actions cache and each matrix job only runs the cheap runtime stage.
#
# Images: ghcr.io/<owner>/ecommerce/<name>:{sha-<short>, <tag>, latest}
# =============================================================================
name: CD images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  TRIVY_EXIT_CODE: ${{ vars.CI_ENFORCE == 'true' && '1' || '0' }}

jobs:
  backend-build:
    name: Compile all backend jars (cached)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/aws/docker/Dockerfile
          target: build
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  images:
    name: Image ${{ matrix.name }}
    needs: backend-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Backend services (same list as deploy/aws/lib/stages.sh SERVICES).
          - { name: gateway, kind: backend }
          - { name: auth-service, kind: backend }
          - { name: product-service, kind: backend }
          - { name: inventory-service, kind: backend }
          - { name: rating-service, kind: backend }
          - { name: user-service, kind: backend }
          - { name: cart-service, kind: backend }
          - { name: order-service, kind: backend }
          - { name: payment-service, kind: backend }
          - { name: promotion-service, kind: backend }
          - { name: notification-service, kind: backend }
          - { name: seller-service, kind: backend }
          - { name: support-service, kind: backend }
          # Frontends (build context is the repo root, see their Dockerfiles).
          - { name: admin-product-catalog, kind: frontend }
          - { name: product-catalog, kind: frontend }
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image name
        id: img
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.name }}
        run: |
          {
            echo "image=${REGISTRY}/${OWNER,,}/ecommerce/${NAME}"
            if [[ "${{ matrix.kind }}" == "backend" ]]; then
              echo "file=deploy/aws/docker/Dockerfile"
              echo "args=SERVICE=${NAME}"
              echo "scope=backend"
            else
              echo "file=apps/${NAME}/Dockerfile"
              echo "args="
              echo "scope=${NAME}"
            fi
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.img.outputs.image }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      # 1) build into the local daemon so it can be scanned BEFORE anything is pushed
      - name: Build (not pushed yet)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.img.outputs.file }}
          build-args: ${{ steps.img.outputs.args }}
          load: true
          tags: scan-target:ci
          cache-from: type=gha,scope=${{ steps.img.outputs.scope }}
          cache-to: ${{ matrix.kind == 'frontend' && format('type=gha,scope={0},mode=max', steps.img.outputs.scope) || '' }}

      # 2) scan the image (OS packages and the libraries inside the jars / node bundle)
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: scan-target:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: ${{ env.TRIVY_EXIT_CODE }}

      # 3) publish (layers come from the cache, nothing is rebuilt)
      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.img.outputs.file }}
          build-args: ${{ steps.img.outputs.args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.img.outputs.scope }}
