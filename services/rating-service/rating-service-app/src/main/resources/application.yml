# =============================================================================
# rating-service configuration.
#
# The unprofiled document is the DEV/DOCKER-COMPOSE configuration; the `prod`
# document at the bottom records which knobs must move for a real environment.
# Same shape as user-service. NOTHING SECRET HAS A WORKING DEFAULT except the
# throwaway local database password (same value as infra/postgres/init/01-schemas.sql).
# =============================================================================

spring:
  application:
    # THIS EXACT STRING IS A CONTRACT: Eureka uppercases it to RATING-SERVICE,
    # the service id the gateway's `rating` route targets (lb://RATING-SERVICE).
    name: rating-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rating_db}
    username: ${SPRING_DATASOURCE_USERNAME:rating_service}
    password: ${SPRING_DATASOURCE_PASSWORD:rating_service_local_pwd}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      pool-name: rating-hikari

  jpa:
    # Flyway owns the schema.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: rating
        jdbc:
          time_zone: UTC
        enable_lazy_load_no_trans: false

  flyway:
    enabled: true
    schemas: rating
    default-schema: rating
    locations: classpath:db/migration
    validate-on-migrate: true

  # Producer only (rating.events, consumed by product-service). NOT a hard
  # startup dependency: the publish is after-commit and best-effort, and the
  # short max.block.ms bounds how long a broker outage can stall a write.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 2000

  web:
    error:
      whitelabel:
        enabled: false
      include-stacktrace: never
      include-message: never

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

rating:
  jwt:
    # SAME ENV VARS AND DEFAULTS AS auth-service / gateway / the other services.
    issuer: ${AUTH_JWT_ISSUER:https://auth.acme-ecommerce.internal}
    audience: ${AUTH_JWT_AUDIENCES:ecommerce-platform}
    jwks-service-id: ${RATING_JWKS_SERVICE_ID:AUTH-SERVICE}
    jwks-path: /.well-known/jwks.json
    jwks-uri: ${RATING_JWKS_URI:}

# Outbound Feign clients. Resolved through Eureka by service name; SHORT timeouts
# and NO retries - a slow dependency must fail the review request quickly.
# Prefix is spring.cloud.openfeign.client; keys MUST equal the @FeignClient contextId.
spring.cloud.openfeign:
  client:
    config:
      orderPurchaseClient:
        connect-timeout: 1000
        read-timeout: 3000
      userProfileClient:
        connect-timeout: 1000
        read-timeout: 3000
      authAccountClient:
        connect-timeout: 1000
        read-timeout: 3000

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: rating-service

logging:
  level:
    root: INFO
    "[com.acme.ecommerce.rating]": INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

---
# PROFILE: prod
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # No working default in production.
    password: ${SPRING_DATASOURCE_PASSWORD}

logging:
  level:
    root: WARN
    "[com.acme.ecommerce.rating]": INFO

management:
  endpoint:
    health:
      show-details: never
