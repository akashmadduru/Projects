# Test profile (TD-TEST-01). The datasource comes from AbstractOrderIntegrationTest
# (@DynamicPropertySource, Testcontainers Postgres); every other service is mocked per test.
spring:
  kafka:
    # No broker in a test JVM: never start listeners, and fail a send in 2 s.
    listener:
      auto-startup: false
    producer:
      properties:
        max.block.ms: 2000
  cloud:
    discovery:
      enabled: false

order:
  # Tests drive OutboxRelay.relay() directly; the scheduled pass would race them.
  outbox:
    initial-delay-ms: 3600000
  jwt:
    # Fetched lazily, only if a request carries a token; these tests call services directly.
    jwks-uri: http://localhost:1/.well-known/jwks.json

eureka:
  client:
    enabled: false
