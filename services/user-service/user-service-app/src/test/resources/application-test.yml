# Test profile (TD-TEST-01). The datasource comes from AbstractUserIntegrationTest.
spring:
  kafka:
    listener:
      auto-startup: false
    producer:
      properties:
        max.block.ms: 2000
  cloud:
    discovery:
      enabled: false

user:
  referral:
    ip-hash-salt: test-only-referral-salt
  jwt:
    jwks-uri: http://localhost:1/.well-known/jwks.json
  # The outbox relay is driven by the tests (relay()); keep the scheduler out of their way.
  outbox:
    initial-delay-ms: 3600000

eureka:
  client:
    enabled: false
