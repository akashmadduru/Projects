# =============================================================================
# notification-service configuration. Since Phase 8 it owns notification_db (inbox, push
# subscriptions, campaigns). Dev/docker-compose defaults; mail goes to mailpit (UI :8025).
# =============================================================================
spring:
  application:
    name: notification-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:notification_service}
    password: ${SPRING_DATASOURCE_PASSWORD:notification_service_local_pwd}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: notification
  flyway:
    enabled: true
    schemas: notification
    default-schema: notification
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  web:
    error:
      whitelabel:
        enabled: false
      include-stacktrace: never
      include-message: never

server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful

notification:
  # Shared secret for /internal/** (X-Internal-Token). No default: fail closed.
  internal-token: ${INTERNAL_API_TOKEN:}
  sender: ${NOTIFICATION_SENDER:no-reply@acme.local}
  storefront-base-url: ${STOREFRONT_BASE_URL:http://localhost:3000}
  sms-mailbox-domain: acme.local
  jwt:
    issuer: ${AUTH_JWT_ISSUER:https://auth.acme-ecommerce.internal}
    audience: ${AUTH_JWT_AUDIENCES:ecommerce-platform}
    jwks-service-id: ${NOTIFICATION_JWKS_SERVICE_ID:AUTH-SERVICE}
    jwks-uri: ${NOTIFICATION_JWKS_URI:}
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@acme.local}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  # Phase 10 tracing: Micrometer Tracing -> OTel -> OTLP/HTTP (Jaeger). Production sampling 10%; dev compose sets 1.0.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    # A down SMTP relay must not flip the service DOWN (and out of Eureka).
    mail:
      enabled: false
  metrics:
    tags:
      application: notification-service

logging:
  level:
    root: INFO
    "[com.acme.ecommerce.notification]": INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
