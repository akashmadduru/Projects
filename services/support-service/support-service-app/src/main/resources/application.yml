# support-service configuration (dev/docker-compose defaults; prod delta at the bottom).
spring:
  application:
    # Eureka id; the gateway route targets lb://SUPPORT-SERVICE.
    name: support-service

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/support_db}
    username: ${SPRING_DATASOURCE_USERNAME:support_service}
    password: ${SPRING_DATASOURCE_PASSWORD:support_service_local_pwd}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      pool-name: support-hikari
      connection-init-sql: SET search_path TO support, public

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: support
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    schemas: support
    default-schema: support
    locations: classpath:db/migration
    validate-on-migrate: true

  web:
    error:
      whitelabel:
        enabled: false
      include-stacktrace: never
      include-message: never

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  cloud:
    openfeign:
      client:
        config:
          supportNotificationClient:
            connect-timeout: 1000
            read-timeout: 3000
          supportOrderClient:
            connect-timeout: 1000
            read-timeout: 3000

server:
  port: ${SERVER_PORT:8092}
  shutdown: graceful

support:
  internal-token: ${INTERNAL_API_TOKEN:}
  storefront-url: ${STOREFRONT_BASE_URL:http://localhost:3000}
  jwt:
    issuer: ${AUTH_JWT_ISSUER:https://auth.acme-ecommerce.internal}
    audience: ${AUTH_JWT_AUDIENCES:ecommerce-platform}
    jwks-service-id: ${SUPPORT_JWKS_SERVICE_ID:AUTH-SERVICE}
    jwks-path: /.well-known/jwks.json
    jwks-uri: ${SUPPORT_JWKS_URI:}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

management:
  # Phase 10 tracing: Micrometer Tracing -> OTel -> OTLP/HTTP (Jaeger). Production sampling 10%; dev compose sets 1.0.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: support-service

logging:
  level:
    root: INFO
    "[com.acme.ecommerce.support]": INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId:-}] [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    password: ${SPRING_DATASOURCE_PASSWORD}

logging:
  level:
    root: WARN
    "[com.acme.ecommerce.support]": INFO

management:
  endpoint:
    health:
      show-details: never
