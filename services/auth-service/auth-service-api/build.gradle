// =============================================================================
// auth-service-api - the PUBLISHED CONTRACT of auth-service (Phase 1C).
//
// This jar ends up on the classpath of every service that talks to auth-service
// (and, later, of the gateway). That is why it holds DTOs and one Feign
// interface and nothing else: no entities, no Spring Boot application, no
// persistence, no security wiring. A consumer must be able to depend on the
// contract without inheriting the implementation's dependency tree.
//
// Every web/validation dependency is `compileOnly` on purpose - the annotations
// are compiled in, but the consumer's own starter supplies them at runtime, so
// this module never forces a web stack (or a Spring version) onto anyone.
// =============================================================================
plugins { id 'java-library' }

dependencies {
    api project(':libs:common-core')

    // Bean-validation annotations on the request DTOs. RUNTIME-retained, so a
    // consumer that has a validator applies them; one that does not simply
    // ignores them (a missing annotation class is skipped by reflection).
    compileOnly libs.jakarta.validation.api

    // Spring MVC annotations used by the declarative AuthClient. Spring Cloud
    // OpenFeign reads @PostMapping/@RequestHeader, not feign's own annotations.
    compileOnly libs.spring.web
    compileOnly libs.feign.core

    // Lombok for DTO generation - fine-grained control over getters, setters, builders
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    testImplementation libs.jakarta.validation.api
    testImplementation libs.spring.web
    testImplementation libs.assertj.core
}
