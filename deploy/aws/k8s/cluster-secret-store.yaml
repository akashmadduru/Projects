# Tells External Secrets where to read from: AWS Secrets Manager in this region.
#
# There is deliberately no `auth:` block. The External Secrets pod gets its AWS credentials from
# EKS Pod Identity (an association created by Terraform for the "external-secrets" service
# account), so no access key exists anywhere in the cluster.
#
# Applied by deploy.sh with __REGION__ substituted.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: __REGION__
