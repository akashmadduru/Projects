{{- $g := .Values.global }}
{{- range $name, $svc := .Values.services }}
{{- $s := mergeOverwrite (deepCopy $.Values.serviceDefaults) (deepCopy $svc) }}
{{- $ctx := dict "name" $name "root" $ }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $g.namespace }}
  labels:
    {{- include "ecommerce.labels" $ctx | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $g.namespace }}
  labels:
    {{- include "ecommerce.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "ecommerce.selector" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ $s.port }}
      targetPort: http
{{- end }}
