{{- if .Values.global.tracing.enabled }}
{{- $g := .Values.global }}
# Trace backend. The services already export OTLP/HTTP traces (Micrometer Tracing); this is the
# same Jaeger all-in-one the local docker-compose uses, with IN-MEMORY storage (last ~5000 traces).
# It is a debugging aid, not durable storage. Reach the UI with:
#   kubectl -n {{ $g.namespace }} port-forward svc/jaeger 16686:16686
#
# X-Ray was NOT used: Micrometer generates random W3C trace ids, and X-Ray only accepts ids whose
# first 4 bytes are a recent timestamp, so most traces would be silently dropped.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: {{ $g.namespace }}
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: ecommerce-platform
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
            - { name: MEMORY_MAX_TRACES, value: "5000" }
            - { name: GOMEMLIMIT, value: 200MiB }
          ports:
            - { name: otlp-http, containerPort: 4318 }
            - { name: ui, containerPort: 16686 }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 256Mi }
          readinessProbe:
            httpGet: { path: /, port: 14269 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: {{ $g.namespace }}
  labels:
    app.kubernetes.io/name: jaeger
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: ui, port: 16686, targetPort: ui }
{{- end }}
