{{- $g := .Values.global }}
# Secrets live in AWS Secrets Manager and are synced into Kubernetes by External Secrets (installed
# by deploy.sh; its pod authenticates with EKS Pod Identity, so there is no credential in the
# cluster for it). Nothing secret is in this chart or in Terraform's plan output.
#
# The ClusterSecretStore these refer to is applied by deploy.sh from k8s/cluster-secret-store.yaml
# (it must exist before the database bootstrap Job, which runs before this chart is installed).
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: {{ $g.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: app-secrets, creationPolicy: Owner }
  dataFrom:
    - extract: { key: {{ $g.secretPrefix }}/app }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-secrets
  namespace: {{ $g.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: db-secrets, creationPolicy: Owner }
  dataFrom:
    - extract: { key: {{ $g.secretPrefix }}/db }
---
# The JWT signing keystore is stored base64-encoded (it is binary) and decoded on the way in.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-keystore
  namespace: {{ $g.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets-manager, kind: ClusterSecretStore }
  target: { name: jwt-keystore, creationPolicy: Owner }
  data:
    - secretKey: jwt-keystore.p12
      remoteRef:
        key: {{ $g.secretPrefix }}/jwt-keystore
        decodingStrategy: Base64
