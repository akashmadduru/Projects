# =============================================================================
# Gradle build environment settings.
# =============================================================================

# google-java-format reaches into javac internals (com.sun.tools.javac.*). On
# JDK 16+ those packages are strongly encapsulated, so the Gradle daemon JVM
# that runs Spotless needs them explicitly exported. Without these flags
# `spotlessApply`/`spotlessCheck` fails with IllegalAccessError.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m \
  --add-exports jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED \
  --add-exports jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
