<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | Cartwise</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fff3d6; color: #1d2b3a; font-family: system-ui, sans-serif; text-align: center; padding: 1rem; }
      main { max-width: 26rem; }
      h1 { font-size: 1.75rem; }
      button { background: #1b7469; color: #fff3d6; border: 2px solid #1d2b3a; border-radius: 999px; padding: 0.6rem 1.4rem; font-weight: 700; font-size: 1rem; cursor: pointer; }
      button:focus-visible { outline: 3px solid #1d2b3a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Cartwise could not reach the network. Pages you have already visited may still work. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
